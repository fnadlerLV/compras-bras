<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 46" fill="none" style="display: block; width: 100%; height: 100%">
  <defs>
    <linearGradient id="cbGradBagIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="45%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="cbGradHandleIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <filter id="cbShadowIcon" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Brilho / Sparkle Superior -->
  <path d="M37 4L38.5 7.5L42 9L38.5 10.5L37 14L35.5 10.5L32 9L35.5 7.5Z" fill="#FFE600" />
  
  <!-- Alça da Sacola -->
  <path d="M15 16V10C15 5.58 18.58 2 23 2C27.42 2 31 5.58 31 10V16" 
        fill="none" stroke="url(#cbGradHandleIcon)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Corpo da Sacola com cantos suaves -->
  <rect x="5" y="13" width="36" height="31" rx="7" fill="url(#cbGradBagIcon)" filter="url(#cbShadowIcon)" />
  
  <!-- Linha de costura/aba superior -->
  <path d="M5 19C9 20.5 37 20.5 41 19" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Sorriso / Monograma 'CB' ou dinâmica de entrega -->
  <path d="M14 27C17.5 33 28.5 33 32 27" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  <circle cx="29" cy="23" r="2.2" fill="#FFFFFF" />
  <circle cx="17" cy="23" r="2.2" fill="#FFFFFF" />
  
  <!-- Tag de Desconto / Oferta Relâmpago -->
  <rect x="26" y="30" width="16" height="13" rx="3.5" fill="#FFFFFF" filter="url(#cbShadowIcon)" />
  <text x="34" y="40.5" font-family="'Archivo', 'Impact', sans-serif" font-weight="900" font-size="10" fill="#E64A19" text-anchor="middle">⚡%</text>
</svg>
